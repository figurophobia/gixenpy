[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gixenpy"
version = "0.5.0"
description = "Unofficial Python client for Gixen.com (eBay sniping) — automates its website since there's no public API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "figurophobia" }]
keywords = ["gixen", "ebay", "sniping", "auction", "scraping", "bidding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.32",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/figurophobia/gixenpy"
Repository = "https://github.com/figurophobia/gixenpy"
Issues = "https://github.com/figurophobia/gixenpy/issues"

[project.scripts]
gixenpy = "gixenpy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gixenpy = ["py.typed"]
